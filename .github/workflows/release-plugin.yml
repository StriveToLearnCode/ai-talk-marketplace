name: Release AI Talk marketplace

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-ai-talk-marketplace
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify public mirror
        run: node scripts/sync-public-marketplace.mjs

      - name: Run Node tests
        run: node --test tests/*.test.mjs plugins/ai-talk/tests/*.test.mjs plugins/ai-talk/skills/ai-talk/tests/test_*.mjs

      - name: Run Python tests
        run: python3 -m unittest plugins/ai-talk/skills/ai-talk/tests/test_skill_contract.py

      - name: Prepare immutable release version
        run: node scripts/prepare-marketplace-release.mjs --source-sha "$GITHUB_SHA"

      - name: Publish marketplace branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/ai-talk/.codex-plugin/plugin.json
          git add ai-talk-public-marketplace/plugins/ai-talk/.codex-plugin/plugin.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): prepare $GITHUB_SHA"
          fi
          release_commit=$(git subtree split --prefix=ai-talk-public-marketplace HEAD)
          # This generated branch contains a release-only version commit that never lands on master.
          git push --force origin "$release_commit:refs/heads/marketplace"
